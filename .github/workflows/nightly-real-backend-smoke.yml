name: Nightly Real Provider Smoke

on:
  schedule:
    - cron: '30 2 * * *' # daily 02:30 UTC
  workflow_dispatch:

jobs:
  real-provider-smoke:
    name: Real provider smoke (staging)
    runs-on: ubuntu-latest
    environment: staging
    continue-on-error: true
    timeout-minutes: 20
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/dev-requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt

      - name: Run real backend smoke tests (retry-aware)
        working-directory: ./backend
        env:
          PROVIDER_MODE: "real"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKIP_REAL_API_TESTS: "false"
        run: |
          pytest tests/test_real_backends.py -v -s
