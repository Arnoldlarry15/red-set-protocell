[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_no_return = False
warn_unreachable = False
strict_equality = False
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False

# Pre-existing type errors in legacy modules - suppress until incrementally fixed
# TODO: address each module's type errors and remove the corresponding ignore_errors entry
[mypy-app.telemetry.extractors]
ignore_errors = True

[mypy-app.telemetry.exporter]
ignore_errors = True

[mypy-app.middleware.monitoring]
ignore_errors = True

[mypy-app.middleware.auth]
ignore_errors = True

[mypy-app.analytics.time_tracking]
ignore_errors = True

[mypy-app.engines.selection]
ignore_errors = True

[mypy-app.engines.mutation]
ignore_errors = True

[mypy-app.core.egg]
ignore_errors = True

[mypy-app.agents.target]
ignore_errors = True

[mypy-app.agents.spotter]
ignore_errors = True

[mypy-app.agents.sniper]
ignore_errors = True

[mypy-app.main]
ignore_errors = True

[mypy-app.api_server]
ignore_errors = True
