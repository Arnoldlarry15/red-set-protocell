services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RSP_ENVIRONMENT=${RSP_ENVIRONMENT:-development}
      - RSP_ALLOWED_ORIGINS=${RSP_ALLOWED_ORIGINS:-http://localhost:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RSP_DEMO_PASSWORD=${RSP_DEMO_PASSWORD:-changeme}
      - RSP_REQUIRE_AUTH=${RSP_REQUIRE_AUTH:-false}
    volumes:
      - sessions-data:/app/sessions

  frontend:
    build:
      context: ./frontend
      args:
        # Frontend is static, so API URL must be accessible from user's browser
        # Use localhost when running locally, or set to your domain in production
        - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  sessions-data:
