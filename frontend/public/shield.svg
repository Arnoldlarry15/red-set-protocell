<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield background -->
  <path d="M60 10 L100 30 L100 60 Q100 85 60 110 Q20 85 20 60 L20 30 Z" 
        fill="url(#grad1)" 
        opacity="0.2"/>
  
  <!-- Shield outline -->
  <path d="M60 10 L100 30 L100 60 Q100 85 60 110 Q20 85 20 60 L20 30 Z" 
        stroke="#ef4444" 
        stroke-width="3" 
        fill="none"/>
  
  <!-- Inner shield detail -->
  <path d="M60 25 L85 38 L85 60 Q85 77 60 95 Q35 77 35 60 L35 38 Z" 
        stroke="#ffffff" 
        stroke-width="2" 
        fill="none" 
        opacity="0.6"/>
  
  <!-- Center symbol (abstract cell/molecule) -->
  <circle cx="60" cy="60" r="8" fill="#ffffff"/>
  <circle cx="60" cy="60" r="4" fill="#ef4444"/>
  
  <!-- Connection lines -->
  <line x1="60" y1="60" x2="60" y2="40" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="60" x2="75" y2="70" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  <line x1="60" y1="60" x2="45" y2="70" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
  
  <!-- Small nodes -->
  <circle cx="60" cy="40" r="3" fill="#ffffff"/>
  <circle cx="75" cy="70" r="3" fill="#ffffff"/>
  <circle cx="45" cy="70" r="3" fill="#ffffff"/>
</svg>
